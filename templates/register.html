{% extends 'template.jinja' %}

{% block body %}
<br>
<div class="container py-5">
    <form class="form-control-lg p-5 border-primary border-2 shadow " style="width : 65%; margin: 0 auto;"
        method="post">
        <h2><img src="/static/parking.svg" width="70" height="90" alt="">&nbsp;Register</h2>
        <label for="username" class="form-label"><b>Name</b></label>
        <input class="form-control mb-4 border-primary " id="username" type="name" name="username"
            placeholder="full name" required>
        <label for="inputEmail5" class="form-label"><b>Email</b></label>
        <input class="form-control mb-4 border-primary " id="inputEmail5" type="email" name="email"
            placeholder="User's Email" required>
        <label for="inputPassword5" class="form-label"><b>Create Password</b></label>
        <input class="form-control mb-4  border-primary " id="inputPassword5" type="text" name="password"
            placeholder="Password" required>
        <div class="d-flex justify-content-center mb-5"><button class='btn btn-outline-primary'
                type="submit">&nbsp;&nbsp;&nbsp;Register&nbsp;&nbsp;&nbsp;</button></div>
        <div class="container text-center">Already Registered ?&nbsp;&nbsp;&nbsp;<a href="/">login</a></div>
    </form>
</div>
{% endblock %}

{% block script %}
{% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
           <script>alert('{{ message }}');</script>
        {% endfor %}
    {% endif %}
{% endwith %}
{% endblock %}
